apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    basicAuth: true
    basicAuthUser: ${CLICKHOUSE_USER}
    secureJsonData:
      basicAuthPassword: ${CLICKHOUSE_PASSWORD}
    jsonData:
      database: ${CLICKHOUSE_DB}
      port: 8123
      server: clickhouse
      useYandexCloudAuthorization: false
    isDefault: false
    editable: true