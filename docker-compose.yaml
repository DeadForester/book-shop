services:
  postgres_db:
    env_file:
      - .env
    networks:
      - book-shop
    container_name: postgre_container
    image: postgres:17.1
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  clickhouse:
    env_file:
      - .env
    networks:
      - book-shop
    container_name: clickhouse_container
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    ports:
      - "8123:8123"
      - "9999:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  minio:
    env_file:
      - .env
    networks:
      - book-shop
    container_name: minio_container
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    volumes:
      - minio-storage:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    command: server /data --console-address ":9001"
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    env_file:
      - .env
    networks:
      - book-shop
    container_name: redis_container
    image: redis:8.6.3
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_USER: "${REDIS_USER}"
      REDIS_USER_PASSWORD: "${REDIS_USER_PASSWORD}"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    env_file:
      .env
    networks:
      - book-shop
    container_name: backend_container
    build: ./backend/book-service
    environment:
      APP_DATASOURCE_URL: "jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}"
      APP_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      APP_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_FLYWAY_URL: "jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}"
      SPRING_FLYWAY_USERNAME: "${POSTGRES_USER}"
      SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD}"
      APP_MINIO_URL: "http://minio:9000"
      APP_MINIO_ACCESSKEY: "${MINIO_USER}"
      APP_MINIO_SECRETKEY: "${MINIO_PASSWORD}"
      SERVER_PORT: "${SERVER_PORT}"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    env_file:
      - .env
    networks:
      - book-shop
    container_name: frontend_container
    build: ./front
    ports:
      - "${FRONTEND_PORT}:${SERVER_PORT}"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio-storage:
  clickhouse_data:
  redis_data:

networks:
  book-shop: