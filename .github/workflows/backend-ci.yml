name: Backend CI

on:
  workflow_call:

jobs:
  backend_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Run build
        working-directory: ./backend/book-service
        run: mvn clean package -DskipTests